name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: JavaScript syntax
        run: |
          for f in *.js aura-store/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Deploy configs parse
        run: |
          python -c "import json; json.load(open('vercel.json', encoding='utf-8'))"
          python -c "import tomllib; [tomllib.load(open(p, 'rb')) for p in ('netlify.toml', 'aura-store/netlify.toml')]"

      # One h1 per page, no skipped levels (handoff invariant 14).
      - name: Heading outline
        run: python tools/check_headings.py

      # No script/stylesheet included twice; every local include has ?v=.
      - name: Asset includes
        run: python tools/check_assets.py

      # Retracted claims (unbacked cost, stale counts, Groq-first routing...) stay out.
      - name: Retracted claims
        run: python tools/check_claims.py
      # Enforced CSP: no inline handlers, inline scripts only by hash, same policy on Vercel and Netlify (5A).
      - name: CSP guard
        run: python tools/check_csp.py

  # Browser smoke tests: console errors, axe (no serious/critical), 375 px
  # overflow, local links, theme toggle, keyboard lightbox and mobile menu.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7
