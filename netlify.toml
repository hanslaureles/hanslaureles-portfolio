# Netlify Configuration for Hans Laureles Portfolio
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Clean URLs & Redirects
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/case-vellum"
  to = "/case-vellum.html"
  status = 200

[[redirects]]
  from = "/case-lumina"
  to = "/case-lumina.html"
  status = 200

[[redirects]]
  from = "/case-fintrack"
  to = "/case-fintrack.html"
  status = 200

[[redirects]]
  from = "/case-lsfm"
  to = "/case-lsfm.html"
  status = 200

[[redirects]]
  from = "/case-aura"
  to = "/case-aura.html"
  status = 200

[[redirects]]
  from = "/aura-store"
  to = "/aura-store/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
